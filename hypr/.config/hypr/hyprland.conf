autogenerated = 0 # remove this line to remove the warning

monitor=,preferred,auto-left,1
monitor = HDMI-A-1, 1920x1080, 0x0, 1, mirror, eDP-1

# trigger when the switch is turning off
# bindl = , switch:off:Lid Switch,exec,hyprctl keyword monitor "eDP-1, 1920x1080, 0x0, 1"
bindl = , switch:off:Lid Switch,exec,~/.config/hypr/scripts/lid_switch.sh on
# trigger when the switch is turning on
# bindl = , switch:on:Lid Switch,exec,hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:on:Lid Switch,exec,~/.config/hypr/scripts/lid_switch.sh off

exec-once = hyprpaper 
exec-once = systemctl --user start gsd-rfkill.service  # bluetooth in gnome-control-center 
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

exec-once = ~/.config/hypr/scripts/monitor-listener.sh

# Import dank material shell configuration
source = dankmaterialshell.conf

$terminal = kitty
$fileManager = nautilus

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct 

input {
    kb_layout = us, us
        kb_variant = dvorak, 
        kb_model =
        kb_options = grp:win_space_toggle, caps:escape, compose:ralt
        kb_rules =

        follow_mouse = 1

        touchpad {
            natural_scroll = yes
            disable_while_typing = no
        }

        resolve_binds_by_sym = 1

    sensitivity = 0 
}

general {
    gaps_in = 5
        gaps_out = 10
        border_size = 2
        col.active_border = rgba(ffffffaa)
        col.inactive_border = rgba(595959aa)

        layout = dwindle

        allow_tearing = false
}

decoration {
    rounding = 10
}

animations {
    enabled = no
        bezier = myBezier, 0.05, 0.9, 0.1, 1.05
        animation = windows, 1, 7, myBezier
        animation = windowsOut, 1, 7, default, popin 80%
        animation = border, 1, 10, default
        animation = borderangle, 1, 8, default
        animation = fade, 1, 7, default
        animation = workspaces, 1, 6, default
}

dwindle {
    preserve_split = yes 
}

gesture = 3, horizontal, workspace

misc {
    force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_splash_rendering = true
    disable_hyprland_logo = true
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

$mainMod = SUPER
$shiftMod = SUPER_SHIFT

bind = $mainMod, return, exec, $terminal
bind = $shiftMod, Q, killactive, 
bind = $mainMod, E, exec, $fileManager
bind = $shiftMod, space, togglefloating, 
bind = $mainMod, C, exec, rofi -show calc -modi calc -no-show-match -no-sort -automatic-save-to-history
bind = $mainMod, I, exec, XDG_CURRENT_DESKTOP=GNOME; gnome-control-center


# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move Active
bind = $shiftMod, h, movewindow, l
bind = $shiftMod, l, movewindow, r
bind = $shiftMod, j, movewindow, u
bind = $shiftMod, k, movewindow, d

bind = $mainMod, 1, exec, ~/.config/hypr/scripts/multi-monitor-workspaces.sh 1
bind = $mainMod, 2, exec, ~/.config/hypr/scripts/multi-monitor-workspaces.sh 2
bind = $mainMod, 3, exec, ~/.config/hypr/scripts/multi-monitor-workspaces.sh 3
bind = $mainMod, 4, exec, ~/.config/hypr/scripts/multi-monitor-workspaces.sh 4
bind = $mainMod, 5, exec, ~/.config/hypr/scripts/multi-monitor-workspaces.sh 5
bind = $mainMod, 6, exec, ~/.config/hypr/scripts/multi-monitor-workspaces.sh 6
bind = $mainMod, 7, exec, ~/.config/hypr/scripts/multi-monitor-workspaces.sh 7
bind = $mainMod, 8, exec, ~/.config/hypr/scripts/multi-monitor-workspaces.sh 8
bind = $mainMod, 9, exec, ~/.config/hypr/scripts/multi-monitor-workspaces.sh 9
bind = $mainMod, 0, exec, ~/.config/hypr/scripts/multi-monitor-workspaces.sh 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# ------------------ MY CONFIG ------------------
bind = $shiftMod, R, exec, hyprctl reload && notify-send "Hyprland config reloaded!"
bind = $mainMod, F, fullscreen

# restart bar
bind = $shiftMod, W, exec, ~/.config/hypr/scripts/restart_dms.sh

# screenshot
bind = , Print, exec, hyprshot -m output -o ~/Pictures/Screenshots
bind = $mainMod, Print, exec, hyprshot -m region -o ~/Pictures/Screenshots
bind = $shiftMod, Print, exec, hyprshot -m window -o ~/Pictures/Screenshots
bind = $shiftMod, S, exec, hyprshot -m region -o ~/Pictures/Screenshots
bind = $mainMod, S, exec, hyprshot -m output -o ~/Pictures/Screenshots

bindl = , XF86AudioPlay, exec, playerctl play-pause  
bindl = , XF86AudioNext, exec, playerctl next 
bindl = , XF86AudioPrev, exec, playerctl previous

# Assign apps to a specific workspace
# to check the class name do `hyprctl clients | grep class`
windowrule = match:class kitty, workspace 1
windowrule = match:class firefox, workspace 2
windowrule = match:class LibreWolf, workspace 2
windowrule = match:class zen, workspace 2
windowrule = match:class zen, workspace 2
windowrule = match:class ord.kde.kdeconnect.app, workspace 6
windowrule = match:class org.mozilla.Thunderbird, workspace 7
windowrule = match:class WebCord, workspace 8
windowrule = match:class discord, workspace 8
windowrule = match:class org.telegram.desktop, workspace 9
windowrule = match:class spotify, workspace 10
windowrule = match:class org.gnome.Music, workspace 10

# screen sharing 
windowrule = opacity 0.0 override, match:class ^xwaylandvideobridge$
windowrule = animation none on, match:class ^xwaylandvideobridge$
windowrule = no_initial_focus on, match:class ^xwaylandvideobridge$
windowrule = max_size 1 1, match:class ^xwaylandvideobridge$
windowrule = no_blur on, match:class ^xwaylandvideobridge$

# fix for the screen sharing
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_CURRENT_DESKTOP,Hyprland
env = GDK_SCALE,1.6

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Set cursor theme
exec-once = hyprctl setcursor Bibata-Modern-Classic 24

source = ./dms/outputs.conf
